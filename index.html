:root{

    --primary:light-dark(#315efb,#7d99ff);

}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

#app{
    min-height:100vh;
    background:var(--bg);
}

header{
    padding:22px 5vw;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:18px;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:5;
}

.brand{
    font-size:1.35rem;
    font-weight:800;
}

.brand span{
    color:var(--primary);
}

nav{

    gap:8px;
    flex-wrap:wrap;
}

nav button,
.btn{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

nav button.active,
.btn.primary{
    background:var(--primary);
    color:white;
    border-color:var(--primary);
}

main{
    max-width:1200px;
    margin:auto;
    padding:42px 5vw 70px;
}

.hero{
    display:grid;
    grid-template-columns:1.4fr .8fr;
    gap:28px;
    align-items:center;
    margin-bottom:30px;
}

.hero h1{
    font-size:clamp(2.2rem,5vw,4.2rem);
    line-height:1.03;
    margin:0 0 16px;
}

.hero p{
    font-size:1.05rem;
    color:var(--muted);
    max-width:650px;
    line-height:1.7;
}

.hero-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 35px rgba(30,50,90,.08);
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.stat{
    background:var(--surface2);
    border-radius:14px;
    padding:18px;
}

.stat b{
    display:block;
    font-size:1.6rem;
}

.stat small{
    color:var(--muted);
}

.panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px;
    margin-top:24px;
}

.panel h2{
    margin-top:0;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    margin-bottom:18px;
}

select,
input{
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--surface);
    color:var(--text);
}

.table-wrap{
    overflow:auto;
}

.timetable{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    min-width:760px;
}

.timetable th,
.timetable td{
    padding:13px;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    text-align:center;
    vertical-align:top;
}

.timetable th{
    background:var(--surface2);
    font-size:.9rem;
}

.time{
    font-weight:700;
    white-space:nowrap;
    color:var(--muted);
}

.slot{
    min-height:74px;
}

.class-card{
    padding:10px;
    border-radius:10px;
    background:light-dark(#e9efff,#293b68);
    text-align:left;
}

.class-card strong{
    display:block;
}

.class-card small{
    color:var(--muted);
}

.feature-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.feature{
    padding:20px;
    border:1px solid var(--border);
    border-radius:14px;
    background:var(--surface);
}

.feature h3{
    margin-top:0;
}

.feature p{
    color:var(--muted);
    line-height:1.55;
}

footer{
    text-align:center;
    color:var(--muted);
    padding:25px;
    border-top:1px solid var(--border);
}

@media(max-width:850px){
    .hero{
        grid-template-columns:1fr;
    }

    .feature-grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:520px){
    header{
        align-items:flex-start;
        flex-direction:column;
    }

    .stats{
        grid-template-columns:1fr;
    }
}
</style>
</head>

`;
}


function esc(s){

return s.replace(
/[&<>'"]/g,
c => ({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
"'":'&#39;',
'"':'&quot;'
}[c])
);

}


document
.querySelectorAll('nav button')
.forEach(
b =>
b.addEventListener(
'click',
() => render(b.dataset.view)
)
);

render();

</script>
